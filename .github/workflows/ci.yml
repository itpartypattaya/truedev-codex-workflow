name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint tool
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: >-
          python -m py_compile
          scripts/truedev_workflow.py
          scripts/validate_release.py
          scripts/package_plugin.py
          tests/test_truedev_workflow.py
          tests/test_plugin_layout.py
          tests/test_release.py
      - name: Ruff
        run: ruff check .
      - name: Release contract
        run: python scripts/validate_release.py
      - name: Build deterministic package
        run: python scripts/package_plugin.py
      - name: Upload public package
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: truedev-workflow-plugin
          path: dist/*.zip
          if-no-files-found: error
