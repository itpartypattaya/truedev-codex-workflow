<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="706" height="520" viewBox="0 0 706 520" role="img" aria-labelledby="title desc">
  <title id="title">TrueDev gate guardrail</title>
  <desc id="desc">A tool mutation is denied until a named workflow gate receives explicit user approval.</desc>
  <rect width="706" height="520" rx="24" fill="#F8FAFC"/>
  <text x="42" y="58" fill="#0F172A" font-family="Arial, sans-serif" font-size="28" font-weight="700">Explicit approval, recorded once</text>
  <text x="42" y="88" fill="#475569" font-family="Arial, sans-serif" font-size="15">A guardrail around mutation—not a replacement for sandboxing or CI.</text>
  <rect x="42" y="124" width="622" height="72" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="82" cy="160" r="18" fill="#7C3AED"/>
  <text x="82" y="166" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">1</text>
  <text x="116" y="153" fill="#0F172A" font-family="Arial, sans-serif" font-size="15" font-weight="700">Codex proposes a mutation</text>
  <text x="116" y="176" fill="#64748B" font-family="Arial, sans-serif" font-size="13">shell · apply_patch · agent · matched MCP call</text>
  <path d="M353 196v34" stroke="#94A3B8" stroke-width="3"/>
  <rect x="42" y="230" width="622" height="108" rx="16" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <circle cx="82" cy="270" r="18" fill="#DC2626"/>
  <text x="82" y="276" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">2</text>
  <text x="116" y="263" fill="#991B1B" font-family="Arial, sans-serif" font-size="15" font-weight="700">PreToolUse denies while REVIEW awaits approval</text>
  <text x="116" y="288" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="13">Invalid state also fails closed for matched mutation tools.</text>
  <rect x="116" y="302" width="214" height="24" rx="12" fill="#FEE2E2"/><text x="223" y="319" fill="#991B1B" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">no inferred “continue” approval</text>
  <path d="M353 338v34" stroke="#94A3B8" stroke-width="3"/>
  <rect x="42" y="372" width="622" height="92" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <circle cx="82" cy="412" r="18" fill="#047857"/>
  <text x="82" y="418" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <text x="116" y="405" fill="#065F46" font-family="Arial, sans-serif" font-size="15" font-weight="700">Named user decision unlocks the ordered transition</text>
  <text x="116" y="430" fill="#065F46" font-family="Consolas, monospace" font-size="12">approve --step REVIEW --user-confirmed</text>
  <text x="42" y="496" fill="#64748B" font-family="Arial, sans-serif" font-size="13">Approval evidence is auditable workflow state, not cryptographic identity proof.</text>
</svg>
